<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f7f6;font-family:Arial,sans-serif;color:#10231c">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #dce6e1;border-radius:20px;padding:36px">
          <tr><td style="font-size:24px;font-weight:800;color:#10231c">Jela AI</td></tr>
          <tr><td style="padding-top:22px;font-size:18px;font-weight:700">Verify your sign-in</td></tr>
          <tr><td style="padding-top:10px;font-size:15px;line-height:1.6;color:#53655e">Enter this 6-digit code in Jela AI. It expires in 10 minutes and can only be used once.</td></tr>
          <tr><td align="center" style="padding:26px 0">
            <span style="display:inline-block;padding:16px 22px;border-radius:14px;background:#effaf4;color:#087443;font-size:30px;font-weight:800;letter-spacing:8px">{{ .Token }}</span>
          </td></tr>
          <tr><td style="font-size:13px;line-height:1.6;color:#718079">If you did not request this code, you can safely ignore this email. Never share your code with anyone.</td></tr>
          <tr><td style="padding-top:24px;font-size:12px;color:#8a9691">Jela AI · A Zentel Insight product</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
